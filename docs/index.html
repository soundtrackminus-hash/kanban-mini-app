<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iMagic Kanban</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>📋 Канбан iMagic</h1>
            <div class="header-stats" id="stats">
                <span class="stat">Всего: <strong>0</strong></span>
                <span class="stat">Готово: <strong class="done-count">0</strong></span>
            </div>
        </header>
        
        <main class="board">
            <div class="column" data-status="todo">
                <div class="column-header">
                    <span class="column-title">📌 К выполнению</span>
                    <span class="column-count" id="count-todo">0</span>
                </div>
                <div class="task-list" id="todo" data-status="todo">
                    <!-- Задачи будут добавлены через JS -->
                </div>
            </div>
            
            <div class="column" data-status="in_progress">
                <div class="column-header">
                    <span class="column-title">🔄 В работе</span>
                    <span class="column-count" id="count-in_progress">0</span>
                </div>
                <div class="task-list" id="in_progress" data-status="in_progress">
                    <!-- Задачи будут добавлены через JS -->
                </div>
            </div>
            
            <div class="column" data-status="blocked">
                <div class="column-header">
                    <span class="column-title">⚠️ Заблокировано</span>
                    <span class="column-count" id="count-blocked">0</span>
                </div>
                <div class="task-list" id="blocked" data-status="blocked">
                    <!-- Задачи будут добавлены через JS -->
                </div>
            </div>
            
            <div class="column" data-status="done">
                <div class="column-header">
                    <span class="column-title">✅ Готово</span>
                    <span class="column-count" id="count-done">0</span>
                </div>
                <div class="task-list" id="done" data-status="done">
                    <!-- Задачи будут добавлены через JS -->
                </div>
            </div>
            
            <div class="column" data-status="canceled">
                <div class="column-header">
                    <span class="column-title">❌ Отменено</span>
                    <span class="column-count" id="count-canceled">0</span>
                </div>
                <div class="task-list" id="canceled" data-status="canceled">
                    <!-- Задачи будут добавлены через JS -->
                </div>
            </div>
        </main>
        
        <div class="fab" id="fab" title="Добавить задачу">
            +
        </div>
        
        <!-- Модальное окно для создания/редактирования задачи -->
        <div class="modal" id="taskModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Новая задача</h2>
                    <button class="close-btn" id="closeModal">×</button>
                </div>
                <form id="taskForm">
                    <input type="hidden" id="taskId">
                    
                    <div class="form-group">
                        <label for="taskTitle">Название *</label>
                        <input type="text" id="taskTitle" required placeholder="Введите название задачи">
                    </div>
                    
                    <div class="form-group">
                        <label for="taskBody">Описание</label>
                        <textarea id="taskBody" rows="3" placeholder="Детали задачи..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskStatus">Статус</label>
                        <select id="taskStatus">
                            <option value="todo">📌 К выполнению</option>
                            <option value="in_progress">🔄 В работе</option>
                            <option value="blocked">⚠️ Заблокировано</option>
                            <option value="done">✅ Готово</option>
                            <option value="canceled">❌ Отменено</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskAssignee">Исполнитель</label>
                        <select id="taskAssignee">
                            <option value="">Не назначен</option>
                            <option value="default">🎯 Координатор</option>
                            <option value="marketer">💰 Маркетолог</option>
                            <option value="monitor">👁️ Монитор</option>
                            <option value="content">✍️ Контент</option>
                            <option value="market">📊 Рынок</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskPriority">Приоритет</label>
                        <select id="taskPriority">
                            <option value="0">Обычный</option>
                            <option value="1">Низкий</option>
                            <option value="2">Средний</option>
                            <option value="3">Высокий</option>
                            <option value="4">Критический</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none">Удалить</button>
                        <button type="submit" class="btn btn-primary" id="saveBtn">Сохранить</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="/public/js/app.js"></script>
</body>
</html>
